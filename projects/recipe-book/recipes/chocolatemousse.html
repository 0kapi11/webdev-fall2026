    <h1>chocolate mousse</h1>
    <img src="https://duckduckgo.com/?q=chocolate+mousse&ia=images&iax=images&iai=https%3A%2F%2Fwww.cookingclassy.com%2Fwp-content%2Fuploads%2F2020%2F02%2Fchocolate-mousse-4.jpg" alt="chocolate-mousse" width="500">

<p> Famous Charfoos Family Mousse</p>
<p>1 cup butter
    1 cup sugar
    4 ounces unsweetended chocolate
    2 teaspoons vanilla
    6 eggs

    Melt chocolate. Cream butter and sugar. Beat in chocolate and vanilla. Add eggs, beating 2 minutes each. Chill and serve at room temperature.
</p>
