<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Name Generator</title>
  
</head>
<body>
    <h1>Name Generator</h1>

    <label for="month">Enter the month you were born:</label>
    <input id="month" type="text" />
    
    <label for="age">Enter your age:</label>
    <input id="age" type="number" min="0">

    <label for="pet">Favorite pet:</label>
    <input id="pet" type="text">

    

    <button type="button" onclick="generatedName()">
        Generate Name
    </button>
    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
