<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Calculator</title>
</head>
<body>
    <label for="usd">Enter your amount in USD:</label>
    <input id="usd" type="number" min="0">
    <p id="USD"></p>;
    <p id="EUR"></p>;
    <p id="GBP"></p>;
    <p id="CAD"></p>;
    <p id="CHF"></p>;
    <p id="JPY"></p>;
    <button type="button" onclick="generatedCurrencies()">
        Generate currencies
    </button>
</body>
</html>
