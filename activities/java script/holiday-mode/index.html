<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Side Bakery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>

    <header id="site-header">
        <h1 id="header-text">Sunny Side Bakery</h1>
        <button onclick="HanukkahMenu()" id="button">Hannukkah Menu</button>
    </header>
    
    <main>
        <h2 id="welcome-heading">Welcome!</h2>
        <p id="welcome-text">
        Fresh bread, cookies, and pies baked every morning.
        Stop by and say hi!
        </p>

        <div id="menu-box">
            <h2>Today's Menu</h2>
            <ul>
                <li>Chocolate Chip Cookies</li>
                <li>Cinnamon Rolls</li>
                <li>Apple Pie</li>
                <li>Sourdough Bread</li>
            </ul>
        </div>
    </main>

    <footer id="site-footer">
        <p>Open every day, 7am - 3pm</p>
    </footer>
</body>
</html>
